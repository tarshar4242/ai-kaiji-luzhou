<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📒 工作事件簿 · Tarshar 2026</title>
<style>
  :root{
    --accent:#5b8a36; --accent-dark:#3d5e26; --ink:#2c2c2c;
    --muted:#6b7280; --line:#e6e6e0; --paper:#fbfaf5;
    --sidebar:#ffffff; --bg:#f3f2ec; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang TC","Noto Sans TC","Helvetica Neue",Arial,sans-serif;
    display:flex;height:100vh;overflow:hidden;}

  /* ===== 左側目錄 ===== */
  aside{width:300px;flex:none;background:var(--sidebar);
    border-right:1px solid var(--line);display:flex;flex-direction:column;
    box-shadow:2px 0 12px rgba(0,0,0,.03);}
  aside .top{background:linear-gradient(135deg,#5b8a36,#3d5e26);color:#fff;
    padding:22px 20px 18px;}
  aside .top .eyebrow{font-size:12px;letter-spacing:.1em;opacity:.9;}
  aside .top h1{margin:6px 0 4px;font-size:21px;letter-spacing:.02em;}
  aside .top p{margin:0;font-size:12.5px;opacity:.9;}
  aside .top a.home{display:inline-block;margin-top:12px;font-size:12.5px;
    color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.5);
    border-radius:20px;padding:3px 12px;transition:background .12s;}
  aside .top a.home:hover{background:rgba(255,255,255,.18);}

  nav{flex:1;overflow-y:auto;padding:14px 12px;}
  nav .navlabel{font-size:11.5px;font-weight:800;letter-spacing:.08em;
    color:var(--accent-dark);padding:6px 10px;}
  nav a.item{display:flex;gap:11px;align-items:flex-start;text-decoration:none;
    color:var(--ink);padding:12px 12px;border-radius:10px;margin-bottom:4px;
    border:1px solid transparent;transition:background .12s,border-color .12s;}
  nav a.item:hover{background:var(--paper);border-color:var(--line);}
  nav a.item.active{background:#eef4e6;border-color:var(--accent);}
  nav a.item .no{font-size:13px;font-weight:800;color:#fff;background:var(--accent);
    border-radius:7px;min-width:28px;height:28px;display:flex;align-items:center;
    justify-content:center;flex:none;}
  nav a.item.active .no{background:var(--accent-dark);}
  nav a.item .meta .t{font-size:14.5px;font-weight:700;line-height:1.35;}
  nav a.item .meta .d{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4;}
  nav .soon{margin:8px 10px;border:1.5px dashed #c9c9bf;color:var(--muted);
    text-align:center;padding:14px;border-radius:10px;font-size:12.5px;}
  aside footer{padding:12px 18px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--muted);text-align:center;}

  /* ===== 右側內容 ===== */
  main{flex:1;display:flex;flex-direction:column;min-width:0;}
  main .bar{display:none;}
  iframe{flex:1;width:100%;border:0;background:#fff;}

  /* ===== 手機版 ===== */
  .menu-btn{display:none;}
  @media (max-width:780px){
    body{flex-direction:column;overflow:auto;height:auto;}
    aside{width:100%;height:auto;}
    nav{max-height:none;}
    main{height:84vh;}
    .menu-btn{display:inline-block;}
  }
</style>
</head>
<body>

  <aside>
    <div class="top">
      <div class="eyebrow">🍀 Tarshar・2026</div>
      <h1>📒 工作事件簿</h1>
      <p>一個專案一則紀錄，點左側切換。</p>
      <a class="home" href="../index.html">← 回工作坊總覽</a>
    </div>
    <nav id="nav">
      <div class="navlabel">事件列表</div>
      <a class="item active" href="01-ai-assistant-team.html" data-src="01-ai-assistant-team.html" target="view">
        <span class="no">01</span>
        <span class="meta">
          <span class="t">一人工作室・AI 助理團隊</span>
          <span class="d">把 AI 當成一支助理團隊來分工，哪些自動、哪些自己來</span>
        </span>
      </a>
      <div class="soon">後續事件陸續加入 ⋯</div>
    </nav>
    <footer>🍀 by Tarshar・工作事件簿</footer>
  </aside>

  <main>
    <iframe name="view" id="view" src="01-ai-assistant-team.html" title="工作事件內容"></iframe>
  </main>

<script>
  // 左側目錄點選：切換 active 樣式並載入右側 iframe（手機版自動捲到內容）
  var nav = document.getElementById('nav');
  var view = document.getElementById('view');
  nav.addEventListener('click', function(e){
    var a = e.target.closest('a.item');
    if(!a) return;
    e.preventDefault();
    nav.querySelectorAll('a.item').forEach(function(x){x.classList.remove('active');});
    a.classList.add('active');
    view.src = a.dataset.src;
    if(window.matchMedia('(max-width:780px)').matches){
      document.querySelector('main').scrollIntoView({behavior:'smooth'});
    }
  });
</script>
</body>
</html>
